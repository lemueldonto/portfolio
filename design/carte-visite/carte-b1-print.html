<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Carte de visite B1 — Lemuel Donto — fichier d’impression</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     CARTE DE VISITE — PISTE B1 « ARÊTE »
     Format fini : 85 × 55 mm  ·  Fond perdu : 3 mm sur chaque bord
     Page PDF    : 91 × 61 mm  ·  Zone de sécurité : 4 mm depuis la coupe
     2 pages : p.1 = recto, p.2 = verso.
     ═══════════════════════════════════════════════════════════════════════ */

  @page { size: 91mm 61mm; margin: 0; }

  :root {
    --paper:    #f7f9fd;   /* blanc papier, légèrement froid */
    --ink:      #0f1e52;   /* encre bleu-navy */
    --accent:   #2a5cf0;   /* bleu électrique */
    --accent-l: #96b9ff;   /* bleu clair, sur fond sombre */
    --navy:     #04123a;   /* bleu roi profond */

    --bleed: 3mm;
    --pad:   9mm;          /* 3 mm de fond perdu + 6 mm de marge intérieure */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }

  .page {
    position: relative;
    width: 91mm; height: 61mm;
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page + .page { page-break-before: always; break-before: page; }

  .recto { background: var(--paper); color: var(--ink); }
  .verso { background: var(--navy); color: #fff; }
  /* Halo discret, même vocabulaire que le hero du site.
     Si l’imprimeur signale un risque de bandes sur le bleu, supprimer ce bloc. */
  .verso::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 80% -12%, rgba(120,160,255,.14), rgba(120,160,255,0) 62%);
  }

  .pad { position: absolute; inset: var(--pad); display: flex; flex-direction: column; z-index: 2; }
  .spacer { flex: 1; }

  /* Mono : 2,1 mm ≈ 6 pt — plancher de lisibilité en impression */
  .mono   { font-family: 'JetBrains Mono', monospace; font-size: 2.1mm; letter-spacing: .2em;  text-transform: uppercase; }
  .mono-s { font-family: 'JetBrains Mono', monospace; font-size: 1.95mm; letter-spacing: .18em; text-transform: uppercase; }
  .rule   { height: .12mm; background: currentColor; opacity: .14; }

  /* ── RECTO ─────────────────────────────────────────────────────────── */

  /* L’arête : 7 mm visibles + 3 mm de débord dans le fond perdu */
  .spine {
    position: absolute; top: 0; right: 0; bottom: 0; width: 10mm;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding-right: 3mm;                 /* recentre l’URL sur les 7 mm visibles */
  }
  .spine span {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: 'JetBrains Mono', monospace; font-size: 2.05mm;
    letter-spacing: .3em; text-transform: uppercase; color: #fff;
  }

  .mark {
    position: relative; width: 8.2mm; height: 8.2mm; border-radius: 1.5mm;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 3.3mm; letter-spacing: -.03em;
  }
  .mark i {
    position: absolute; top: -.5mm; right: -.5mm; width: 2mm; height: 2mm;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 .55mm var(--paper);
  }
  .tick { width: .9mm; background: var(--accent); border-radius: .45mm; align-self: stretch; }

  .name  { font-weight: 600; letter-spacing: -.034em; line-height: .94; font-size: 7.4mm; }
  .role  { font-size: 2.9mm; font-weight: 500; color: var(--accent); margin-top: 2.2mm; }

  /* ── VERSO ─────────────────────────────────────────────────────────── */
  .quote {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 4.1mm; line-height: 1.24; letter-spacing: -.012em; opacity: .92;
  }
  .row { display: flex; align-items: center; gap: 2mm; }
  .ico { width: 2.9mm; height: 2.9mm; flex: none; color: var(--accent-l); }
  .val { font-size: 2.55mm; letter-spacing: -.005em; font-variant-numeric: tabular-nums; }
  .qr  { width: 15mm; height: 15mm; display: block; }
  .qr-panel { background: var(--paper); padding: 1.3mm; border-radius: 1.2mm; line-height: 0; }

  .op-40 { opacity: .4 } .op-45 { opacity: .45 }
</style>
</head>
<body>

</svg>

<div class="page recto">
  <div class="pad" style="right: 15mm">
    <div style="display:flex; align-items:flex-start; justify-content:space-between">
